<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruthwell Model</title>

  <link rel="stylesheet" href="../../main.css" />
  <link rel="icon" type="image/x-icon" href="../../img/cross.ico" />
  <link rel="stylesheet" href="../../3dhop/stylesheet/3dhop.css" />

  <script src="../../3dhop/js/spidergl.js"></script>
  <script src="../../3dhop/js/jquery.js"></script>
  <script src="../../3dhop/js/presenter.js"></script>
  <script src="../../3dhop/js/nexus.js"></script>
  <script src="../../3dhop/js/ply.js"></script>

  <script src="../../3dhop/js/trackball_sphere.js"></script>
  <script src="../../3dhop/js/trackball_turntable.js"></script>
  <script src="../../3dhop/js/trackball_turntable_pan.js"></script>
  <script src="../../3dhop/js/trackball_pantilt.js"></script>

  <script src="../../3dhop/js/init.js"></script>

  <style>
    main { display:block; }

    .viewer-layout{
      display:flex;
      gap:16px;
      align-items:stretch;
      width:100%;
      padding:16px;
    }

    #viewerWrap{
      flex: 1 1 auto;
      min-width: 0;
      height: 70vh;
      min-height: 520px;
      position: relative;
    }

    #3dhop.tdhop{
      width:100%;
      height:100%;
      position:relative;
      border-radius:12px;
      overflow:hidden;
      background:#ddd;
    }

    #draw-canvas{
      width:100% !important;
      height:100% !important;
      display:block;
      background-image:url(../../3dhop/skins/backgrounds/light.jpg);
      background-size:cover;
      background-position:center;
    }

    #infoPanel{
      flex: 0 0 360px;
      max-width: 460px;
      height: 70vh;
      min-height: 520px;
      overflow:auto;
      padding:16px;
      border-radius:12px;
      border: 1px solid rgba(0,0,0,0.15);
      background: rgba(0,0,0,0.04);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #infoPanel h2{ margin:0 0 10px 0; }
    #infoPanel p{ margin:0 0 10px 0; line-height:1.45; }
    #infoPanel .hint{ font-size: 13px; opacity: .8; }

    @media (max-width: 900px){
      .viewer-layout{ flex-direction:column; }
      #viewerWrap{ height: 60vh; min-height: 360px; }
      #infoPanel{ height:auto; min-height:0; flex: 1 1 auto; }
    }

    /* ===== Movement pad (Bruxelles-style, small, not giant) ===== */
    #movePad{
      position:absolute;
      right:14px;
      top:14px;
      z-index:50;
      background: rgba(0,0,0,0.35);
      border-radius: 12px;
      padding: 10px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      user-select:none;
      -webkit-user-select:none;
    }

    #mvc_table{
      border-collapse: collapse;
      text-align: center;
    }
    #mvc_table td{
      padding: 6px;
    }

    /* Your arrow image (rotated like Bruxelles) */
    .move_{
      width: 44px !important;
      height: 44px !important;
      cursor: pointer;
      display:block;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
    }
    .up{ transform: rotate(270deg); }
    .down{ transform: rotate(90deg); }
    .left{ transform: rotate(180deg); }
    .right{ transform: rotate(0deg); }

    /* TOP button image */
    #Top{
      width: 52px !important;
      height: 52px !important;
      cursor: pointer;
      display:block;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
    }
  </style>
</head>

<body>
<header class="header">
  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <label for="menu-toggle" class="hamburger-icon">&#9776;</label>

  <div class="hamburger-menu">
    <a href="../frontmatter/home.html">Home</a>
    <a href="../ruthwell/intro.html">Ruthwell</a>
    <a href="../bewcastle/intro.html">Bewcastle</a>
    <a href="../brussels/intro.html">Brussels</a>

    <div class="submenu-wrapper">
      <input type="checkbox" id="submenu-toggle" class="submenu-toggle">
      <label for="submenu-toggle" class="submenu-label">Chapters</label>
      <div class="submenu">
        <a href="intro.html">Introduction</a>
        <a href="model.html">Model</a>
        <a href="ch1.html">About the Cross</a>
        <a href="ch2.html">About the Scan</a>
      </div>
    </div>

    <a href="../backmatter/table.html">Table of Contents</a>
  </div>

  <a href="../backmatter/table.html">
    <img src="assets/img/head.jpg" alt="Project Image" title="The Brussels Cross">
    <p class="header-text">Brussels</p>
  </a>
</header>

<main>
  <div class="viewer-layout">
    <div id="viewerWrap">
      <!-- prevent browser drag-select issues like the Bruxelles example -->
      <div id="3dhop" class="tdhop" onmousedown="if (event.preventDefault) event.preventDefault()">
        <div id="tdhlg"></div>

        <div id="toolbar">
          <img id="home" title="Home" src="../../3dhop/skins/dark/home.png" onclick="actionsToolbar('home')" /><br/>
          <img id="zoomin" title="Zoom In" src="../../3dhop/skins/dark/zoomin.png" onclick="actionsToolbar('zoomin')" /><br/>
          <img id="zoomout" title="Zoom Out" src="../../3dhop/skins/dark/zoomout.png" onclick="actionsToolbar('zoomout')" /><br/>
          <img id="light" title="Enable Light Control" src="../../3dhop/skins/dark/lightcontrol.png" onclick="actionsToolbar('light')" /><br/>
          <img id="screenshot" title="Save Screenshot" src="../../3dhop/skins/dark/screenshot.png" onclick="actionsToolbar('screenshot')" /><br/>
          <img id="full" title="Full Screen" src="../../3dhop/skins/dark/full.png" onclick="actionsToolbar('full')" />
        </div>

        <!-- ✅ Small, working movement pad (image-based like Bruxelles) -->
        <div id="movePad" aria-label="Move view">
          <table id="mvc_table">
            <tbody>
              <tr>
                <td></td>
                <td><img class="move_ up" id="move_up" title="Move Up" src="assets/img/Arrow.png" /></td>
                <td></td>
              </tr>
              <tr>
                <td><img class="move_ left" id="move_left" title="Move Left" src="assets/img/Arrow.png" /></td>
                <td><img id="Top" title="Top" src="assets/img/Top_m.png" /></td>
                <td><img class="move_ right" id="move_right" title="Move Right" src="assets/img/Arrow.png" /></td>
              </tr>
              <tr>
                <td></td>
                <td><img class="move_ down" id="move_down" title="Move Down" src="assets/img/Arrow.png" /></td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>

        <canvas id="draw-canvas"></canvas>
      </div>
    </div>

    <aside id="infoPanel" aria-live="polite">
      <h2>Explore the Ruthwell Cross</h2>
      <p>Click a panel on the cross to learn more.</p>
      <p class="hint">Once everything is stable, we’ll add clickable hotspots that update this panel.</p>
    </aside>
  </div>

  <script>
    var presenter = null;

    // Side panel content keyed by hotspot ID
    const INFO = {
      archer:    { title: "Archer Panel",    html: `<p><strong>Archer:</strong> Add your description here.</p>` },
      raven:     { title: "Raven Panel",     html: `<p><strong>Raven:</strong> Add your description here.</p>` },
      magdalene: { title: "Magdalene Panel", html: `<p><strong>Magdalene:</strong> Add your description here.</p>` },
      lamb:      { title: "Lamb Panel",      html: `<p><strong>Lamb:</strong> Add your description here.</p>` },
      bottom:    { title: "Bottom Section",  html: `<p><strong>Bottom:</strong> Add your description here.</p>` }
    };

    function setInfoPanel(title, html) {
      const panel = document.getElementById("infoPanel");
      panel.innerHTML = `
        <h2>${title}</h2>
        ${html}
        <p class="hint">Click another area on the cross to keep exploring.</p>
      `;
    }

    function setup3dhop() {
      presenter = new Presenter("draw-canvas");

      presenter.setScene({
        meshes: {
          ruthwell:  { url: "assets/models/Ruthwell_15M.nxz" },
          archer:    { url: "../ruthwell/assets/models/archer.ply" },
          raven:     { url: "../ruthwell/assets/models/raven.ply" },
          magdalene: { url: "../ruthwell/assets/models/magdalene.ply" },
          lamb:      { url: "../ruthwell/assets/models/lamb.ply" },
          bottom:    { url: "../ruthwell/assets/models/bottom.ply" }
        },

        modelInstances: {
          ruthwell: { mesh: "ruthwell", color: [0.8, 0.7, 0.75], visible: true }
        },

        spots: {
          archer:    { mesh: "archer",    visible: true, alpha: 0.0, color: [0.0, 0.5, 1.0] },
          raven:     { mesh: "raven",     visible: true, alpha: 0.0, color: [0.0, 0.5, 1.0] },
          magdalene: { mesh: "magdalene", visible: true, alpha: 0.0, color: [0.0, 0.5, 1.0] },
          lamb:      { mesh: "lamb",      visible: true, alpha: 0.0, color: [0.0, 0.5, 1.0] },
          bottom:    { mesh: "bottom",    visible: true, alpha: 0.0, color: [0.0, 0.5, 1.0] }
        },

        trackball: {
          type: TurntablePanTrackball,
          trackOptions: {
            startPhi: 0.0,
            startTheta: 0.0,
            startDistance: 2.0,
            minMaxPhi: [-180, 180],
            minMaxTheta: [-85.0, 85.0],
            minMaxDist: [0.005, 140.0],
            startPanX: 0.0,
            startPanY: 0.0,
            startPanZ: 0.0,
            minMaxPanX: [-5.0, 5.0],
            minMaxPanY: [-20.0, 20.0],
            minMaxPanZ: [-5.0, 5.0]
          }
        }
      });

      presenter.enableOnHover(true);
      presenter._onPickedSpot = onPickedSpot;

      presenter.resetTrackball();
      setTimeout(() => presenter.repaint(), 120);

      setInfoPanel("Explore the Ruthwell Cross", `<p>Click a panel on the cross to learn more.</p>`);
    }

    function onPickedSpot(id) {
      if (INFO[id]) setInfoPanel(INFO[id].title, INFO[id].html);
      else setInfoPanel("Info", `<p>Clicked: <code>${id}</code></p>`);
    }

    function actionsToolbar(action) {
      if (!presenter) return;

      if (action === 'home') presenter.resetTrackball();
      else if (action === 'zoomin') presenter.zoomIn();
      else if (action === 'zoomout') presenter.zoomOut();
      else if (action === 'light') presenter.enableLightTrackball(!presenter.isLightTrackballEnabled());
      else if (action === 'screenshot') presenter.saveScreenshot();
      else if (action === 'full') presenter.fullscreen();

      // movement pad
      else if (action === 'move_up' || action === 'move_down' || action === 'move_left' || action === 'move_right') step(action);
      else if (action === 'Top') presenter.resetTrackball(); // simple, stable
    }

    // ✅ Bruxelles-style movement: edit trackball position, then animate to it
    function step(action) {
      if (!presenter) return;

      var my_pos = presenter.getTrackballPosition();

      var vstep = 0.10;
      var hstep = 0.10;

      switch (action) {
        case 'move_up':
          my_pos[3] -= vstep;
          presenter.animateToTrackballPosition(my_pos);
          break;

        case 'move_down':
          my_pos[3] += vstep;
          presenter.animateToTrackballPosition(my_pos);
          break;

        case 'move_right': {
          var gr = Math.PI * my_pos[0] / 180; // phi deg -> rad
          my_pos[2] -= hstep * Math.cos(gr);
          my_pos[4] += hstep * Math.sin(gr);
          presenter.animateToTrackballPosition(my_pos);
          break;
        }

        case 'move_left': {
          var gr = Math.PI * my_pos[0] / 180;
          my_pos[2] += hstep * Math.cos(gr);
          my_pos[4] -= hstep * Math.sin(gr);
          presenter.animateToTrackballPosition(my_pos);
          break;
        }
      }
    }

    function hookMovePad() {
      // IMPORTANT: we attach handlers in JS (no inline onclick needed)
      const bind = (id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          actionsToolbar(id);
        });
      };

      bind("move_up");
      bind("move_down");
      bind("move_left");
      bind("move_right");
      bind("Top");
    }

    $(document).ready(function () {
      init3dhop();
      setup3dhop();
      hookMovePad();
    });

    window.addEventListener("resize", function () {
      if (presenter) presenter.repaint();
    });
  </script>
</main>
</body>
</html>
