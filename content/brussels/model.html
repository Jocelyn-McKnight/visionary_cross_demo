<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruthwell Model</title>

  <link rel="stylesheet" href="../../main.css" />
  <link rel="icon" type="image/x-icon" href="../../img/cross.ico" />
  <link rel="stylesheet" href="../../3dhop/stylesheet/3dhop.css" />

  <script src="../../3dhop/js/spidergl.js"></script>
  <script src="../../3dhop/js/jquery.js"></script>
  <script src="../../3dhop/js/presenter.js"></script>
  <script src="../../3dhop/js/nexus.js"></script>
  <script src="../../3dhop/js/ply.js"></script>

  <script src="../../3dhop/js/trackball_sphere.js"></script>
  <script src="../../3dhop/js/trackball_turntable.js"></script>
  <script src="../../3dhop/js/trackball_turntable_pan.js"></script>
  <script src="../../3dhop/js/trackball_pantilt.js"></script>

  <script src="../../3dhop/js/init.js"></script>

  <style>
    main { display:block; }

    .viewer-layout{
      display:flex;
      gap:16px;
      align-items:stretch;
      width:100%;
      padding:16px;
    }

    #viewerWrap{
      flex: 1 1 auto;
      min-width: 0;
      height: 70vh;
      min-height: 520px;
      position: relative;
    }

    #3dhop.tdhop{
      width:100%;
      height:100%;
      position:relative;
      border-radius:12px;
      overflow:hidden;
      background:#ddd;
    }

    #draw-canvas{
      width:100% !important;
      height:100% !important;
      display:block;
      background-image:url(../../3dhop/skins/backgrounds/light.jpg);
      background-size:cover;
      background-position:center;
    }

    #infoPanel{
      flex: 0 0 360px;
      max-width: 460px;
      height: 70vh;
      min-height: 520px;
      overflow:auto;
      padding:16px;
      border-radius:12px;
      border: 1px solid rgba(0,0,0,0.15);
      background: rgba(0,0,0,0.04);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #infoPanel h2{ margin:0 0 10px 0; }
    #infoPanel p{ margin:0 0 10px 0; line-height:1.45; }
    #infoPanel .hint{ font-size: 13px; opacity: .8; }

    @media (max-width: 900px){
      .viewer-layout{ flex-direction:column; }
      #viewerWrap{ height: 60vh; min-height: 360px; }
      #infoPanel{ height:auto; min-height:0; flex: 1 1 auto; }
    }
  </style>
</head>

<body>
  <header class="header">
    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="hamburger-icon">&#9776;</label>

    <div class="hamburger-menu">
      <a href="../frontmatter/home.html">Home</a>
      <a href="../ruthwell/intro.html">Ruthwell</a>
      <a href="../bewcastle/intro.html">Bewcastle</a>
      <a href="../brussels/intro.html">Brussels</a>

      <div class="submenu-wrapper">
        <input type="checkbox" id="submenu-toggle" class="submenu-toggle">
        <label for="submenu-toggle" class="submenu-label">Chapters</label>
        <div class="submenu">
          <a href="intro.html">Introduction</a>
          <a href="model.html">Model</a>
          <a href="ch1.html">About the Cross</a>
          <a href="ch2.html">About the Scan</a>
        </div>
      </div>

      <a href="../backmatter/table.html">Table of Contents</a>
    </div>

    <a href="../backmatter/table.html">
      <img src="assets/img/head.jpg" alt="Project Image" title="The Ruthwell Cross">
      <p class="header-text">Ruthwell</p>
    </a>
  </header>

  <main>
    <div class="viewer-layout">
      <div id="viewerWrap">
        <div id="3dhop" class="tdhop" onmousedown="if (event.preventDefault) event.preventDefault()">
          <div id="tdhlg"></div>

          <div id="toolbar">
            <img id="home" title="Home" src="../../3dhop/skins/dark/home.png" onclick="actionsToolbar('home')" /><br/>
            <img id="zoomin" title="Zoom In" src="../../3dhop/skins/dark/zoomin.png" onclick="actionsToolbar('zoomin')" /><br/>
            <img id="zoomout" title="Zoom Out" src="../../3dhop/skins/dark/zoomout.png" onclick="actionsToolbar('zoomout')" /><br/>
            <img id="light" title="Enable Light Control" src="../../3dhop/skins/dark/lightcontrol.png" onclick="actionsToolbar('light')" /><br/>
            <img id="screenshot" title="Save Screenshot" src="../../3dhop/skins/dark/screenshot.png" onclick="actionsToolbar('screenshot')" /><br/>
            <img id="full" title="Full Screen" src="../../3dhop/skins/dark/full.png" onclick="actionsToolbar('full')" />
          </div>

          <canvas id="draw-canvas"></canvas>
        </div>
      </div>

      <aside id="infoPanel" aria-live="polite">
        <h2>Explore the Ruthwell Cross</h2>
        <p>Hover a panel to highlight it. Click to learn more.</p>
        <p class="hint">If hover doesn’t “glow” much, it’s because the overlay is faint by design.</p>
      </aside>
    </div>

<script>
  var presenter = null;

  // Your hotspot panel content (keys MUST match your spot IDs)
  const INFO = {
    angels_cut: { title: "Angels", html: `<p><strong>Angels:</strong> Add your description here.</p>` },
    archer_cut: { title: "Archer", html: `<p><strong>Archer:</strong> Add your description here.</p>` },
    // add the rest...
  };

  function setInfoPanel(title, html) {
    const panel = document.getElementById("infoPanel");
    panel.innerHTML = `
      <h2>${title}</h2>
      ${html}
      <p class="hint">Hover or click another area to keep exploring.</p>
    `;
  }

  function bindHotspots() {
    if (!presenter) return;

    // Ensure hover/picking is on
    presenter.enableOnHover(true);

    // Hover highlight + live panel update (optional)
    presenter._onEnterSpot = function (id) {
      // console.log("ENTER SPOT:", id);
      if (INFO[id]) setInfoPanel(INFO[id].title, INFO[id].html);
    };

    presenter._onLeaveSpot = function (id) {
      // optional: do nothing
    };

    // Click handler
    presenter._onPickedSpot = function (id) {
      console.log("PICKED SPOT:", id);
      if (INFO[id]) setInfoPanel(INFO[id].title, INFO[id].html);
      else setInfoPanel("Spot", `<p>Clicked: <code>${id}</code></p>`);
    };

    // IMPORTANT: hide overlays but KEEP pickable
    presenter.setSpotVisibility(HOP_ALL, false, true);
  }

  function setup3dhop() {
    presenter = new Presenter("draw-canvas");

    presenter.setScene({
      meshes: {
        // FULL CROSS (your main model)
        ruthwell: { url: "assets/models/ruthwell.ply" },

        // HOTSPOT CUTS (EXAMPLES — change to your real filenames)
        angels_cut: { url: "assets/models/angels_cut.ply" },
        archer_cut: { url: "assets/models/archer_cut.ply" }
        // add the rest...
      },

      modelInstances: {
        main: { mesh: "ruthwell", color: [0.8, 0.7, 0.75], visible: true }
      },

      spots: {
        // IDs here MUST match INFO keys and mesh keys
        angels_cut: { mesh: "angels_cut", color: [0.0, 0.5, 1.0], alpha: 0.20, alphaHigh: 0.55 },
        archer_cut: { mesh: "archer_cut", color: [0.0, 0.5, 1.0], alpha: 0.20, alphaHigh: 0.55 }
        // add the rest...
      },

      trackball: {
        type: TurnTableTrackball,
        trackOptions: {
          startDistance: 2.0,
          minMaxDist: [0.005, 140.0],
          minMaxPhi: [-180, 180],
          minMaxTheta: [-85.0, 85.0]
        }
      }
    });

    presenter.resetTrackball();
    presenter.repaint();

    // Bind once now (works on many setups)
    bindHotspots();

    setInfoPanel("Explore the Ruthwell Cross", `<p>Hover or click a panel on the cross to learn more.</p>`);
  }

  $(document).ready(function () {
    // 1) init sets up default 3DHOP handlers/UI
    init3dhop();

    // 2) create our scene
    setup3dhop();

    // 3) SAFETY RE-BIND: init3dhop (or other scripts) sometimes overwrite handlers AFTER load.
    // Re-apply bindings a moment later, after everything settles.
    setTimeout(bindHotspots, 250);
    setTimeout(bindHotspots, 1000);
  });

  window.addEventListener("resize", function () {
    if (presenter) presenter.repaint();
  });
</script>

  </main>
</body>
</html>
