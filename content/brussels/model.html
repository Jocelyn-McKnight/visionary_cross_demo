.viewer-layout{
display:flex;
gap:16px;
align-items:stretch;
width:100%;
padding:16px;
}

/* LEFT: viewer area gets a guaranteed height */
#viewerWrap{
flex: 1 1 auto;
min-width: 0;
height: 70vh;
min-height: 520px;

}

#3dhop.tdhop{
width:100%;
height:100%;

border-radius:12px;

background:#ddd;
}

#draw-canvas{
width:100% !important;
height:100% !important;
display:block;

/* RIGHT: info panel */
#infoPanel{

padding:16px;
border-radius:12px;

}
#infoPanel h2{ margin:0 0 10px 0; }
#infoPanel p{ margin:0 0 10px 0; line-height:1.45; }

/* Mobile: stack */
@media (max-width: 900px){
.viewer-layout{ flex-direction:column; }
#viewerWrap{ height: 60vh; min-height: 360px; }
#infoPanel{ height:auto; min-height:0; flex: 1 1 auto; }
}

<aside id="infoPanel" aria-live="polite">

<script>
var presenter = null;

// Side panel content keyed by hotspot ID
const INFO = {
archer: {
title: "Archer Panel",
html: `<p><strong>Archer:</strong> Add your description here.</p>`
},
raven: {
title: "Raven Panel",
html: `<p><strong>Raven:</strong> Add your description here.</p>`
},
magdalene: {
title: "Magdalene Panel",
html: `<p><strong>Magdalene:</strong> Add your description here.</p>`
},
lamb: {
title: "lamb Panel",
html: `<p><strong>Lamb:</strong> Add your description here.</p>`
},
bottom: {
title: "Bottom Section",
html: `<p><strong>Bottom:</strong> Add your description here.</p>`
}
};

function setInfoPanel(title, html) {
const panel = document.getElementById("infoPanel");
panel.innerHTML = `
     <h2>${title}</h2>
     ${html}
     <p class="hint">Click another area on the cross to keep exploring.</p>
   `;
}

function setup3dhop() {
presenter = new Presenter("draw-canvas");

presenter.setScene({
  meshes: {
    ruthwell: { url: "assets/models/Ruthwell_15M.nxz" },

    archer:    { url: "../ruthwell/assets/models/archer.ply" },
    raven:     { url: "../ruthwell/assets/models/raven.ply" },
    magdalene: { url: "../ruthwell/assets/models/magdalene.ply" },
    lamb:      { url: "../ruthwell/assets/models/lamb.ply" },
    bottom:    { url: "../ruthwell/assets/models/bottom.ply" },
  },

  modelInstances: {
    ruthwell: { mesh: "ruthwell", color: [0.8, 0.7, 0.75], visible: true }
  },

  spots: {
    archer:    { mesh: "archer",    visible: true, alpha: 0.0, color: [0.0, 0.5, 1.0] },
    raven:     { mesh: "raven",     visible: true, alpha: 0.0, color: [0.0, 0.5, 1.0] },
    magdalene: { mesh: "magdalene", visible: true, alpha: 0.0, color: [0.0, 0.5, 1.0] },
    lamb:      { mesh: "lamb",      visible: true, alpha: 0.0, color: [0.0, 0.5, 1.0] },
    bottom:    { mesh: "bottom",    visible: true, alpha: 0.0, color: [0.0, 0.5, 1.0] },
  }, 

trackball: {
type: TurnTableTrackball,
trackOptions: {
startDistance: 2.0,
minMaxDist: [0.005, 140.0],
minMaxPhi: [-180, 180],
minMaxTheta: [-85.0, 85.0]
}
}
});

// Hover detection is optional (turn off if it slows down)
presenter.enableOnHover(true);

// Click handler for hotspots
presenter._onPickedSpot = onPickedSpot;

// Optional hover handlers (do nothing by default)
presenter._onEnterSpot = function(id) {};
presenter._onLeaveSpot = function(id) {};

presenter.resetTrackball();
setTimeout(() => presenter.repaint(), 120);

// Default side panel text
setInfoPanel(
"Explore the Ruthwell Cross",
`<p>Click a panel on the cross to learn more.</p>`
);
}

function onPickedSpot(id) {
if (INFO[id]) setInfoPanel(INFO[id].title, INFO[id].html);
else setInfoPanel("Info", `<p>Clicked: <code>${id}</code></p>`);
}

function actionsToolbar(action) {
if (!presenter) return;
if (action === "home") presenter.resetTrackball();
else if (action === "zoomin") presenter.zoomIn();
else if (action === "zoomout") presenter.zoomOut();
else if (action === "light") presenter.enableLightTrackball(!presenter.isLightTrackballEnabled());
else if (action === "screenshot") presenter.saveScreenshot();
else if (action === "full") presenter.fullscreen();
}

function panView(dx, dy) {
  if (!presenter) return;

  // Small step; tweak to taste
  const step = 0.06;

  // If the presenter exposes a direct pan API, use it.
  // Otherwise, fall back to nudging the trackball target (most builds support one of these).
  const tb = presenter._trackball;

  // Best-case: pan method exists
  if (tb && typeof tb.pan === "function") {
    tb.pan(dx * step, dy * step);
    presenter.repaint();
    return;
  }

  // Common alt: translate method exists
  if (tb && typeof tb.translate === "function") {
    tb.translate(dx * step, dy * step, 0);
    presenter.repaint();
    return;
  }

  // Worst-case: no pan available in this build
  console.warn("No pan/translate method found on trackball in this 3DHOP build.");
}

function hookMovePad() {
  const pad = document.getElementById("movePad");
  if (!pad) return;

  // Click controls
  pad.addEventListener("click", (e) => {
    const btn = e.target.closest(".mv");
    if (!btn) return;

    const mv = btn.dataset.mv;
    if (mv === "home") return presenter && presenter.resetTrackball();

    if (mv === "up") panView(0, +1);
    if (mv === "down") panView(0, -1);
    if (mv === "left") panView(-1, 0);
    if (mv === "right") panView(+1, 0);
  });

  // Hold-to-move (optional but feels nice)
  let holdTimer = null;
  pad.addEventListener("mousedown", (e) => {
    const btn = e.target.closest(".mv");
    if (!btn) return;
    const mv = btn.dataset.mv;
    if (mv === "home") return;

    const dir = { up:[0,1], down:[0,-1], left:[-1,0], right:[1,0] }[mv];
    if (!dir) return;

    holdTimer = setInterval(() => panView(dir[0], dir[1]), 35);
  });

  window.addEventListener("mouseup", () => {
    if (holdTimer) clearInterval(holdTimer);
    holdTimer = null;
  });
}


$(document).ready(function () {
init3dhop();
setup3dhop();
});

window.addEventListener("resize", function () {
if (presenter) presenter.repaint();
});
</script>

</main>
