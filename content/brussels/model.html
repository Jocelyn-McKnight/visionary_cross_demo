<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brussels Model</title>

  <link rel="stylesheet" href="../../main.css" />
  <link rel="icon" type="image/x-icon" href="../../img/cross.ico" />
  <link rel="stylesheet" href="../../3dhop/stylesheet/3dhop.css" />

  <script src="../../3dhop/js/spidergl.js"></script>
  <script src="../../3dhop/js/jquery.js"></script>
  <script src="../../3dhop/js/presenter.js"></script>
  <script src="../../3dhop/js/nexus.js"></script>
  <script src="../../3dhop/js/ply.js"></script>

  <script src="../../3dhop/js/trackball_sphere.js"></script>
  <script src="../../3dhop/js/trackball_turntable.js"></script>
  <script src="../../3dhop/js/trackball_turntable_pan.js"></script>
  <script src="../../3dhop/js/trackball_pantilt.js"></script>

  <script src="../../3dhop/js/init.js"></script>

  <style>
    main { display:block; }

    .viewer-layout{
      display:flex;
      gap:16px;
      align-items:stretch;
      width:100%;
      padding:16px;
    }

    #viewerWrap{
      flex: 1 1 auto;
      min-width: 0;
      height: 70vh;
      min-height: 520px;
      position: relative;
    }

    #3dhop.tdhop{
      width:100%;
      height:100%;
      position:relative;
      border-radius:12px;
      overflow:hidden;
      background:#ddd;
    }

    #draw-canvas{
      width:100% !important;
      height:100% !important;
      display:block;
      background-image:url(../../3dhop/skins/backgrounds/light.jpg);
      background-size:cover;
      background-position:center;
    }

    #infoPanel{
      flex: 0 0 360px;
      max-width: 460px;
      height: 70vh;
      min-height: 520px;
      overflow:auto;
      padding:16px;
      border-radius:12px;
      border: 1px solid rgba(0,0,0,0.15);
      background: rgba(0,0,0,0.04);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #infoPanel h2{ margin:0 0 10px 0; }
    #infoPanel p{ margin:0 0 10px 0; line-height:1.45; }
    #infoPanel .hint{ font-size: 13px; opacity: .8; }

    @media (max-width: 900px){
      .viewer-layout{ flex-direction:column; }
      #viewerWrap{ height: 60vh; min-height: 360px; }
      #infoPanel{ height:auto; min-height:0; flex: 1 1 auto; }
    }
  </style>
</head>

<body>
  <header class="header">
    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="hamburger-icon">&#9776;</label>

    <div class="hamburger-menu">
      <a href="../frontmatter/home.html">Home</a>
      <a href="../ruthwell/intro.html">Ruthwell</a>
      <a href="../bewcastle/intro.html">Bewcastle</a>
      <a href="../brussels/intro.html">Brussels</a>

      <div class="submenu-wrapper">
        <input type="checkbox" id="submenu-toggle" class="submenu-toggle">
        <label for="submenu-toggle" class="submenu-label">Chapters</label>
        <div class="submenu">
          <a href="intro.html">Introduction</a>
          <a href="model.html">Model</a>
          <a href="ch1.html">About the Cross</a>
          <a href="ch2.html">About the Scan</a>
        </div>
      </div>

      <a href="../backmatter/table.html">Table of Contents</a>
    </div>

    <a href="../backmatter/table.html">
      <img src="assets/img/head.jpg" alt="Project Image" title="The Brussels Cross">
      <p class="header-text">Brussels</p>
    </a>
  </header>

  <main>
    <div class="viewer-layout">
      <div id="viewerWrap">
        <div id="3dhop" class="tdhop" onmousedown="if (event.preventDefault) event.preventDefault()">
          <div id="tdhlg"></div>

          <div id="toolbar">
            <img id="home" title="Home" src="../../3dhop/skins/dark/home.png" onclick="actionsToolbar('home')" /><br/>
            <img id="zoomin" title="Zoom In" src="../../3dhop/skins/dark/zoomin.png" onclick="actionsToolbar('zoomin')" /><br/>
            <img id="zoomout" title="Zoom Out" src="../../3dhop/skins/dark/zoomout.png" onclick="actionsToolbar('zoomout')" /><br/>
            <img id="light" title="Enable Light Control" src="../../3dhop/skins/dark/lightcontrol.png" onclick="actionsToolbar('light')" /><br/>
            <img id="hotspot" title="Show/Hide Hotspots" src="../../3dhop/skins/dark/pin.png" onclick="actionsToolbar('hotspot')" /><br/>
            <img id="screenshot" title="Save Screenshot" src="../../3dhop/skins/dark/screenshot.png" onclick="actionsToolbar('screenshot')" /><br/>
            <img id="full" title="Full Screen" src="../../3dhop/skins/dark/full.png" onclick="actionsToolbar('full')" />
          </div>

                    <!-- Right tools -->
          <div id="right_tolbar" style="position: fixed; right: 1%; top:0%; z-index:2;">

            <!-- Start COMPASS -->
            <br>
            <div style=" border-radius: 5px; font-family:verdana; font-size:15px; padding:3px;">
              <div id="compassC">
                <canvas id="compassCanvas"
                  style="background:#555555; width:145; height:145; border:2px solid #000000;"
                  onclick="compassClick(event);" width="145" height="145">
                </canvas>
              </div>
              <br>
              <table id="mvc_table">
                <tbody>

                  <!----***************** Start manager MOVE ******************-->
                  <br />
                  <tr>
                    <td></td>
                    <td>
                      <img class="move_ up" id="move_up" title="Move Up" src="img/Arrow.png" />
                    </td>
                    <td></td>
                  </tr>
                  <tr>
                    <td><img class="move_ left" id="move_left" title="Move Leftt" src="img/Arrow.png" />
                    </td>

                    <td>
                      <img id="Top" title="Top" src="img/Top_m.png" />
                    </td>

                    <td><img class="move_ right" id="move_right" title="Move Right" src="img/Arrow.png" />
                    </td>
                  </tr>
                  <tr>
                    <td></td>
                    <td>
                      <img class="move_ down" id="move_down" title="Move Down" src="img/Arrow.png" />
                    </td>
                    <td></td>
                  </tr>
                  <!----***************** End manager MOVE ******************-->

                </tbody>
              </table>
            </div>
            <!-- End COMPASS -->
          </div>

          <canvas id="draw-canvas"></canvas>
        </div>
      </div>

      <aside id="infoPanel" aria-live="polite">
        <h2>Explore the Brussels Cross</h2>
        <p>Hover a panel to see it “light up”. Click to update this panel.</p>
        <p class="hint">If nothing lights up, the *_cut meshes may not align with the full model.</p>
      </aside>
    </div>

<script>
  var presenter = null;
  var overlaysVisible = false;

  // Side panel content keyed by hotspot ID
  const INFO = {
    angels:          { title: "Angels",          html: `<p><strong>Angels:</strong> Add your description here.</p>` },
    archer:          { title: "Archer",          html: `<p><strong>Archer:</strong> Add your description here.</p>` },
    bottom:          { title: "Bottom",          html: `<p><strong>Bottom:</strong> Add your description here.</p>` },
    bottom_back:     { title: "Bottom (Back)",   html: `<p><strong>Bottom (Back):</strong> Add your description here.</p>` },
    centre:          { title: "Centre",          html: `<p><strong>Centre:</strong> Add your description here.</p>` },
    giving:          { title: "Giving",          html: `<p><strong>Giving:</strong> Add your description here.</p>` },
    jesus:           { title: "Jesus",           html: `<p><strong>Jesus:</strong> Add your description here.</p>` },
    jesus_and_guy:   { title: "Jesus and Figure",html: `<p><strong>Jesus and figure:</strong> Add your description here.</p>` },
    lamb:            { title: "Lamb",            html: `<p><strong>Lamb:</strong> Add your description here.</p>` },
    left_cross_bar:  { title: "Left Cross-Bar",  html: `<p><strong>Left cross-bar:</strong> Add your description here.</p>` },
    left_side:       { title: "Left Side",       html: `<p><strong>Left side:</strong> Add your description here.</p>` },
    magdelene:       { title: "Magdelene",       html: `<p><strong>Magdelene:</strong> Add your description here.</p>` },
    raven:           { title: "Raven",           html: `<p><strong>Raven:</strong> Add your description here.</p>` },
    two_people:      { title: "Two People",      html: `<p><strong>Two people:</strong> Add your description here.</p>` },
    two_people_back: { title: "Two People (Back)",html:`<p><strong>Two people (back):</strong> Add your description here.</p>` }
  };

  function setInfoPanel(title, html) {
    const panel = document.getElementById("infoPanel");
    panel.innerHTML = `
      <h2>${title}</h2>
      ${html}
      <p class="hint">Click another area on the cross to keep exploring.</p>
    `;
  }

  function onPickedSpot(id) {
    if (INFO[id]) setInfoPanel(INFO[id].title, INFO[id].html);
    else setInfoPanel("Info", `<p>Clicked hotspot: <code>${id}</code></p>`);
  }

  function setup3dhop() {
    presenter = new Presenter("draw-canvas");

    presenter.setScene({
      meshes: {
        // FULL CROSS MODEL (change filename if needed)
        ruthwell:        { url: "assets/models/ruthwell.ply" },

        // HOTSPOT CUTS (must align with the full model)
        angels_cut:          { url: "assets/models/angels_cut.ply" },
        archer_cut:          { url: "assets/models/archer_cut.ply" },
        bottom_cut:          { url: "assets/models/bottom_cut.ply" },
        bottom_back_cut:     { url: "assets/models/bottom_back_cut.ply" },
        centre_cut:          { url: "assets/models/centre_cut.ply" },
        giving_cut:          { url: "assets/models/giving_cut.ply" },
        jesus_cut:           { url: "assets/models/jesus_cut.ply" },
        jesus_and_guy_cut:   { url: "assets/models/jesus_and_guy_cut.ply" },
        lamb_cut:            { url: "assets/models/lamb_cut.ply" },
        left_cross_bar_cut:  { url: "assets/models/left_cross_bar_cut.ply" },
        left_side_cut:       { url: "assets/models/left_side_cut.ply" },
        magdelene_cut:       { url: "assets/models/magdelene_cut.ply" },
        raven_cut:           { url: "assets/models/raven_cut.ply" },
        two_people_cut:      { url: "assets/models/two_people_cut.ply" },
        two_people_back_cut: { url: "assets/models/two_people_back_cut.ply" }
      },

      modelInstances: {
        main: {
          mesh: "ruthwell",
          color: [0.8, 0.7, 0.75],
          visible: true
        }
      },

      // IMPORTANT:
      // alpha: 0.0 = invisible normally
      // alphaHigh: > 0 = lights up on hover
      // This gives you “highlight feedback” without always showing blue overlays.
      spots: {
        angels:          { mesh: "angels_cut",          color:[0,0.5,1], alpha:0.0, alphaHigh:0.55 },
        archer:          { mesh: "archer_cut",          color:[0,0.5,1], alpha:0.0, alphaHigh:0.55 },
        bottom:          { mesh: "bottom_cut",          color:[0,0.5,1], alpha:0.0, alphaHigh:0.55 },
        bottom_back:     { mesh: "bottom_back_cut",     color:[0,0.5,1], alpha:0.0, alphaHigh:0.55 },
        centre:          { mesh: "centre_cut",          color:[0,0.5,1], alpha:0.0, alphaHigh:0.55 },
        giving:          { mesh: "giving_cut",          color:[0,0.5,1], alpha:0.0, alphaHigh:0.55 },
        jesus:           { mesh: "jesus_cut",           color:[0,0.5,1], alpha:0.0, alphaHigh:0.55 },
        jesus_and_guy:   { mesh: "jesus_and_guy_cut",   color:[0,0.5,1], alpha:0.0, alphaHigh:0.55 },
        lamb:            { mesh: "lamb_cut",            color:[0,0.5,1], alpha:0.0, alphaHigh:0.55 },
        left_cross_bar:  { mesh: "left_cross_bar_cut",  color:[0,0.5,1], alpha:0.0, alphaHigh:0.55 },
        left_side:       { mesh: "left_side_cut",       color:[0,0.5,1], alpha:0.0, alphaHigh:0.55 },
        magdelene:       { mesh: "magdelene_cut",       color:[0,0.5,1], alpha:0.0, alphaHigh:0.55 },
        raven:           { mesh: "raven_cut",           color:[0,0.5,1], alpha:0.0, alphaHigh:0.55 },
        two_people:      { mesh: "two_people_cut",      color:[0,0.5,1], alpha:0.0, alphaHigh:0.55 },
        two_people_back: { mesh: "two_people_back_cut", color:[0,0.5,1], alpha:0.0, alphaHigh:0.55 }
      },

      trackball: {
        type: TurnTableTrackball,
        trackOptions: {
          startDistance: 2.0,
          minMaxDist: [0.005, 140.0],
          minMaxPhi: [-180, 180],
          minMaxTheta: [-85.0, 85.0]
        }
      }
    });

    // Enable hover + picking
    presenter.enableOnHover(true);
    presenter._onPickedSpot = onPickedSpot;

    // Cursor feedback on hover (optional but helps)
    presenter._onEnterSpot = function(id){
      document.getElementById("draw-canvas").style.cursor = "pointer";
    };
    presenter._onLeaveSpot = function(id){
      document.getElementById("draw-canvas").style.cursor = "grab";
    };

    // THIS is the big fix:
    // Spots must be "visible" for hover highlighting to render (even if alpha=0).
    // Also keep them pickable.
    presenter.setSpotVisibility(HOP_ALL, true, true);
    overlaysVisible = false;

    presenter.resetTrackball();
    setTimeout(() => presenter.repaint(), 120);

    setInfoPanel("Explore the Brussels Cross", `<p>Hover a panel to highlight it. Click to open details here.</p>`);
  }

  function actionsToolbar(action) {
    if (!presenter) return;

    if (action === "home") presenter.resetTrackball();
    else if (action === "zoomin") presenter.zoomIn();
    else if (action === "zoomout") presenter.zoomOut();
    else if (action === "light") presenter.enableLightTrackball(!presenter.isLightTrackballEnabled());
    else if (action === "screenshot") presenter.saveScreenshot();
    else if (action === "full") presenter.fullscreen();
    else if (action === "hotspot") {
      // Toggle ALWAYS-visible overlays (for debugging / teaching)
      overlaysVisible = !overlaysVisible;
      if (overlaysVisible) {
        // show overlays at low alpha (alphaHigh still applies on hover)
        presenter.setSpotVisibility(HOP_ALL, true, true);
        // also temporarily bump base alpha so you can see overlays
        // (simple approach: just rely on alphaHigh + hover, or regenerate spots if you want)
      } else {
        // keep visible=true so hover highlight still works; overlays stay “invisible” because alpha=0
        presenter.setSpotVisibility(HOP_ALL, true, true);
      }
      presenter.enableOnHover(true);
    }
  }

  $(document).ready(function () {
    init3dhop();
    setup3dhop();

    // Re-apply after init3dhop in case it overwrote handlers
    setTimeout(() => {
      if (!presenter) return;
      presenter.enableOnHover(true);
      presenter._onPickedSpot = onPickedSpot;
      presenter.setSpotVisibility(HOP_ALL, true, true);
    }, 200);
  });

  window.addEventListener("resize", function () {
    if (presenter) presenter.repaint();
  });
</script>

  </main>
</body>
</html>
