  <style>
    #infoPanel {

      overflow-y: auto;

      margin-top: 0;
      margin-bottom: 1rem;
    }

    .panel-section {
      margin-bottom: 2rem;
    }

      margin-bottom: 0.75rem;
    }

    .direction-list,
    .panel-links {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .direction-list li,
    .panel-item {
      margin-bottom: 0.75rem;
    }

    .direction-list button,
    .panel-item button {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      cursor: pointer;
      text-align: left;
      color: inherit;
    }

    .direction-list button:hover,
    .panel-item button:hover,
    .panel-item a:hover {
      color: #2f80ed;
    }

    .panel-item a {
      display: block;
      font-size: 0.9rem;
      margin-top: 0.2rem;
      text-decoration: none;
    }

<body>
<header class="header">
  <input type="checkbox" id="menu-toggle" class="menu-toggle">

  <div class="hamburger-menu">
    <a href="../frontmatter/home.html">Home</a>

    <a href="../bewcastle/intro.html">Bewcastle</a>
    <a href="../brussels/intro.html">Brussels</a>

    <div class="submenu-wrapper">
      <input type="checkbox" id="submenu-toggle" class="submenu-toggle">
      <label for="submenu-toggle" class="submenu-label">Chapters</label>
      <div class="submenu">
        <a href="intro.html">Introduction</a>
        <a href="model.html">Model</a>
        <a href="ch1.html">About the Cross</a>
        <a href="ch2.html">About the Scan</a>
      </div>
    </div>

    <a href="../backmatter/table.html">Table of Contents</a>
  </div>

  <a href="../backmatter/table.html">
    <img src="assets/img/head.jpg" alt="Project Image" title="The Ruthwell Cross">
    <p class="header-text">Ruthwell</p>
  </a>
</header>

<main>
  <div class="viewer-layout">
    <div id="viewerWrap">
      <div id="3dhop" class="tdhop" onmousedown="if (event.preventDefault) event.preventDefault()">
        <div id="tdhlg"></div>

        <div id="toolbar">
          <img id="home" title="Home" src="../../3dhop/skins/dark/home.png" onclick="actionsToolbar('home')" /><br/>
          <img id="zoomin" title="Zoom In" src="../../3dhop/skins/dark/zoomin.png" onclick="actionsToolbar('zoomin')" /><br/>
          <img id="zoomout" title="Zoom Out" src="../../3dhop/skins/dark/zoomout.png" onclick="actionsToolbar('zoomout')" /><br/>
          <img id="light" title="Enable Light Control" src="../../3dhop/skins/dark/lightcontrol.png" onclick="actionsToolbar('light')" /><br/>
          <img id="screenshot" title="Save Screenshot" src="../../3dhop/skins/dark/screenshot.png" onclick="actionsToolbar('screenshot')" /><br/>
          <img id="full" title="Full Screen" src="../../3dhop/skins/dark/full.png" onclick="actionsToolbar('full')" />
        </div>

        <div id="movePad" aria-label="Move view">
          <table id="mvc_table">
            <tbody>
              <tr>
                <td>
                  <img class="move_ up" id="move_up" title="Move Up" src="assets/img/Arrow.png" />
                </td>
              </tr>
              <tr>
                <td>
                  <img class="move_ down" id="move_down" title="Move Down" src="assets/img/Arrow.png" />
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <canvas id="draw-canvas"></canvas>
      </div>
    </div>

    <aside id="infoPanel">
      <h2>Explore the Visionary Cross Project</h2>

      <section class="panel-section">
        <h3>Directionality</h3>
        <ul class="direction-list">
          <li><button type="button" onclick="faceDirection('front')">Front</button></li>
          <li><button type="button" onclick="faceDirection('back')">Back</button></li>
          <li><button type="button" onclick="faceDirection('left')">Left</button></li>
          <li><button type="button" onclick="faceDirection('right')">Right</button></li>
        </ul>
      </section>

      <section class="panel-section">
        <h3>Explore the Panels</h3>
        <div class="panel-links">

          <div class="panel-item">
            <button type="button" onclick="highlightPanel('angels')">Angels</button>
            <a href="panels/angels.html">Learn more</a>
          </div>

          <div class="panel-item">
            <button type="button" onclick="highlightPanel('archer')">Archer</button>
            <a href="panels/archer.html">Learn more</a>
          </div>

          <div class="panel-item">
            <button type="button" onclick="highlightPanel('bottom')">Bottom Panel</button>
            <a href="panels/bottom.html">Learn more</a>
          </div>

          <div class="panel-item">
            <button type="button" onclick="highlightPanel('lamb')">Lamb</button>
            <a href="panels/lamb.html">Learn more</a>
          </div>

          <div class="panel-item">
            <button type="button" onclick="highlightPanel('left_side')">Left Side</button>
            <a href="panels/left_side.html">Learn more</a>
          </div>

          <div class="panel-item">
            <button type="button" onclick="highlightPanel('magdalene')">Magdalene</button>
            <a href="panels/magdalene.html">Learn more</a>
          </div>

          <div class="panel-item">
            <button type="button" onclick="highlightPanel('raven')">Raven</button>
            <a href="panels/raven.html">Learn more</a>
          </div>

          <div class="panel-item">
            <button type="button" onclick="highlightPanel('right_cross_bar')">Right Cross Bar</button>
            <a href="panels/right_cross_bar.html">Learn more</a>
          </div>

        </div>
      </section>
    </aside>
  </div>

  <script>
    var presenter = null;
    var activeSpot = null;

    var spotIds = [
      "angels",
      "archer",
      "bottom",
      "lamb",
      "left_side",
      "magdalene",
      "raven",
      "right_cross_bar"
    ];

    function setup3dhop() {
      presenter = new Presenter("draw-canvas");

      presenter.setScene({
        meshes: {
          ruthwell:        { url: "assets/models/ruthwell_15m_comp.nxz" },
          angels:          { url: "assets/models/angels_cut.ply" },
          archer:          { url: "assets/models/archer_cut.ply" },
          bottom:          { url: "assets/models/bottom_cut.ply" },
          lamb:            { url: "assets/models/lamb_cut.ply" },
          left_side:       { url: "assets/models/left_side_cut.ply" },
          magdalene:       { url: "assets/models/magdalene_cut.ply" },
          raven:           { url: "assets/models/raven_cut.ply" },
          right_cross_bar: { url: "assets/models/right_cross_bar_cut.ply" }
        },

        modelInstances: {
          ruthwell: {
            mesh: "ruthwell",
            color: [0.8, 0.7, 0.75],
            visible: true
          }
        },

        spots: {
          angels: {
            mesh: "angels",
            visible: true,
            alpha: 0.0,
            color: [0.0, 0.5, 1.0]
          },
          archer: {
            mesh: "archer",
            visible: true,
            alpha: 0.0,
            color: [0.0, 0.5, 1.0]
          },
          bottom: {
            mesh: "bottom",
            visible: true,
            alpha: 0.0,
            color: [0.0, 0.5, 1.0]
          },
          lamb: {
            mesh: "lamb",
            visible: true,
            alpha: 0.0,
            color: [0.0, 0.5, 1.0]
          },
          left_side: {
            mesh: "left_side",
            visible: true,
            alpha: 0.0,
            color: [0.0, 0.5, 1.0]
          },
          magdalene: {
            mesh: "magdalene",
            visible: true,
            alpha: 0.0,
            color: [0.0, 0.5, 1.0]
          },
          raven: {
            mesh: "raven",
            visible: true,
            alpha: 0.0,
            color: [0.0, 0.5, 1.0]
          },
          right_cross_bar: {
            mesh: "right_cross_bar",
            visible: true,
            alpha: 0.0,
            color: [0.0, 0.5, 1.0]
          }
        },

        trackball: {
          type: TurntablePanTrackball,
          trackOptions: {
            startPhi: 0.0,
            startTheta: 0.0,
            startDistance: 2.0,
            minMaxPhi: [-180, 180],
            minMaxTheta: [-85.0, 85.0],
            minMaxDist: [0.005, 140.0],
            startPanX: 0.0,
            startPanY: 0.0,
            startPanZ: 0.0,
            minMaxPanX: [-5.0, 5.0],
            minMaxPanY: [-20.0, 20.0],
            minMaxPanZ: [-5.0, 5.0]
          }
        }
      });

      presenter.enableOnHover(true);
      presenter._onPickedSpot = onPickedSpot;

      presenter.resetTrackball();
      setTimeout(function () {
        presenter.repaint();
      }, 120);
    }

    function clearHighlights() {
      if (!presenter) return;

      for (var i = 0; i < spotIds.length; i++) {
        presenter.setSpotVisibility(spotIds[i], true, true);
        presenter.setSpotColor(spotIds[i], [0.0, 0.5, 1.0, 0.0]);
      }

      activeSpot = null;
      presenter.repaint();
    }

    function highlightPanel(id) {
      if (!presenter) return;

      clearHighlights();
      presenter.setSpotVisibility(id, true, true);
      presenter.setSpotColor(id, [0.0, 0.5, 1.0, 0.65]);

      activeSpot = id;
      presenter.repaint();
    }

    function onPickedSpot(id) {
      highlightPanel(id);
    }

    function faceDirection(direction) {
      if (!presenter) return;

      var my_pos = presenter.getTrackballPosition();

      switch (direction) {
        case "front":
          my_pos[0] = 0;
          break;
        case "right":
          my_pos[0] = 90;
          break;
        case "back":
          my_pos[0] = 180;
          break;
        case "left":
          my_pos[0] = -90;
          break;
      }

      presenter.animateToTrackballPosition(my_pos);
    }

    function actionsToolbar(action) {
      if (!presenter) return;

      if (action === "home") presenter.resetTrackball();
      else if (action === "zoomin") presenter.zoomIn();
      else if (action === "zoomout") presenter.zoomOut();
      else if (action === "light") presenter.enableLightTrackball(!presenter.isLightTrackballEnabled());
      else if (action === "screenshot") presenter.saveScreenshot();
      else if (action === "full") presenter.fullscreen();
      else if (
        action === "move_up" ||
        action === "move_down" ||
        action === "move_left" ||
        action === "move_right"
      ) {
        step(action);
      }
    }

    function step(action) {
      if (!presenter) return;

      var my_pos = presenter.getTrackballPosition();
      var vstep = 0.10;
      var hstep = 0.10;

      switch (action) {
        case "move_up":
          my_pos[3] += vstep;
          presenter.animateToTrackballPosition(my_pos);
          break;

        case "move_down":
          my_pos[3] -= vstep;
          presenter.animateToTrackballPosition(my_pos);
          break;

        case "move_right":
          var gr1 = Math.PI * my_pos[0] / 180;
          my_pos[2] -= hstep * Math.cos(gr1);
          my_pos[4] += hstep * Math.sin(gr1);
          presenter.animateToTrackballPosition(my_pos);
          break;

        case "move_left":
          var gr2 = Math.PI * my_pos[0] / 180;
          my_pos[2] += hstep * Math.cos(gr2);
          my_pos[4] -= hstep * Math.sin(gr2);
          presenter.animateToTrackballPosition(my_pos);
          break;
      }
    }

    function hookMovePad() {
      function bind(id) {
        var el = document.getElementById(id);
        if (!el) return;

        el.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          actionsToolbar(id);
        });
      }

      bind("move_up");
      bind("move_down");
    }

    $(document).ready(function () {
      init3dhop();
      setup3dhop();
      hookMovePad();
    });

    window.addEventListener("resize", function () {
      if (presenter) presenter.repaint();
    });
  </script>
</main>
</body>
</html>
