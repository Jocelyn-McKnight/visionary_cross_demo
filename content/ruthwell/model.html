<script type="text/javascript">
  var presenter = null;

  async function setup3dhop() {
    presenter = new Presenter("draw-canvas");

    const zenodoUrl = "https://zenodo.org/records/17794756/files/Raven_Ruthwell_Cross_small.nxs";

    const response = await fetch(zenodoUrl, { mode: "no-cors" });
    const blob = await response.blob();
    const localUrl = URL.createObjectURL(blob);

    presenter.setScene({
      meshes: {
        "mesh_1": { url: localUrl }
      },
      modelInstances: {
        "model_1": {
          mesh: "mesh_1",
          color: [1.0, 1.0, 1.0]
        }
      },
      trackball: {
        type: TurnTableTrackball,
        trackOptions: {
          startDistance: 3.0,
          minMaxDist: [1.0, 5.0],
          minMaxPhi: [-180, 180],
          minMaxTheta: [-30.0, 70.0]
        }
      }
    });

    presenter.enableLightTrackball(true);
    presenter.resetTrackball();
  }

  function actionsToolbar(action) {
    if(action == 'home') presenter.resetTrackball();
    else if(action == 'zoomin') presenter.zoomIn();
    else if(action == 'zoomout') presenter.zoomOut();
    else if(action == 'light') { presenter.enableLightTrackball(!presenter.isLightTrackballEnabled()); }
    else if(action == 'screenshot') presenter.saveScreenshot();
    else if(action == 'full') presenter.fullscreen();
  }

  $(document).ready(function(){
    init3dhop();
    setup3dhop();
  });
</script>
